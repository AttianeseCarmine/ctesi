# configs/config_sha.yaml
# ============================================================
# ZIP-CLIP-EBC: Configurazione STABILE (MAE ~84)
# ============================================================

RUN_NAME: "vit_sha_reduction_16_"
SEED: 42
DEVICE: "cuda"

# ============================================================
# DATASET
# ============================================================
DATASET: "sha"
DATA:
  NAME: "sha"
  ROOT: "./data/sha/"  # Assicurati che il path sia corretto
  TRAIN_SPLIT: "train"
  VAL_SPLIT: "val"
  NORM_MEAN: [0.48145466, 0.4578275, 0.40821073] # CLIP mean
  NORM_STD:  [0.26862954, 0.26130258, 0.27577711] # CLIP std
  CROP_SIZE: 448       # Input size del modello
  IMG_EXTS: [".jpg", ".png"]

# Modifica per Stage 1 (ZIP)
BACKBONE:
  TYPE: "vit_b_16"      
  PRETRAINED: "openai"
  FREEZE_BN: True

# ============================================================
# MODEL: CLIP_EBC
# ============================================================
CLIP_EBC_MODEL:
  BACKBONE: "vit_b_16"    # "resnet50" o "vit_b_16"
  REDUCTION: 16           # 8 per ResNet, 16 per ViT-B (nativo)
  INPUT_SIZE: 448
  
  # Parametri Visual Prompt Tuning (VPT) - Specifici per ViT
  NUM_VPT: 32             # Dal paper: 32 token è ottimale
  DEEP_VPT: True          # Prompt su tutti i layer
  VPT_DROP: 0.0

  # Bin Configuration
  # È CRUCIALE che questo file esista (es. copiato da configs/reduction_16.json)
BINS:
  - [0, 0]
  - [1, 1]
  - [2, 2]
  - [3, 3]
  - [4, 5]       # Accorpa
  - [6, 7]       # Accorpa
  - [8, "inf"]   # Alza la soglia dell'infinito

NUM_BINS: 7
# Anchor points stimati per SHA a riduzione 16
BIN_CENTERS: [0.0, 1.0, 2.0, 3.0, 4.5, 6.5, 12.5]


# ============================================================
# TRAINING STAGES
# ============================================================
TRAIN_STAGE1:
  EPOCHS: 1000
  BATCH_SIZE: 32
  NUM_WORKERS: 8
  VAL_INTERVAL: 5
  OPTIMIZER: "adamw"
  LR_BACKBONE: 1.0e-5
  LR_HEAD: 5.0e-4
  WEIGHT_DECAY: 1.0e-4
  POS_WEIGHT: 8

EVAL_STAGE1:
  THRESHOLD: 0.3
# ============================================================
# TRAINING (Stage 2)
# ============================================================
TRAIN_STAGE2:
  EPOCHS: 1300 # Il paper usa ~500-1000 per dataset piccoli, 200 per start
  BATCH_SIZE: 8 # 8 va bene su GPU medie (es. 24GB), scendi a 4 se OOM
  NUM_WORKERS: 4
  
  # Optimizer
  LR_BACKBONE: 0.0        # 0.0 perché CLIP ViT è congelato! (Solo VPT si allena)
  LR_HEAD: 1.0e-4         # Learning rate per VPT e Decoder
  WEIGHT_DECAY: 1.0e-4
  
  # Scheduler
  WARMUP_EPOCHS: 5

# ============================================================
# LOSS (DACE)
# ============================================================
LOSS_STAGE2:
  WEIGHT_COUNT: 5      # Lambda nel paper
  COUNT_LOSS: "dmcount"  # Usa la loss basata su OT
  WEIGHT_OT: 0.1         # Default DMCount param
  WEIGHT_TV: 0.01        # Default DMCount param

