# configs/config_shb.yaml
# ============================================================
# ZIP-CLIP-EBC: Configurazione per ShanghaiTech Part B (SHB)
# ============================================================

RUN_NAME: "shb"
SEED: 42
DEVICE: "cuda"

# ============================================================
# DATASET
# ============================================================
DATASET: "shb"  # Cambiato da sha a shb
DATA:
  ROOT: "./data/shb/"  # Path corretto per SHB
  TRAIN_SPLIT: "train"
  VAL_SPLIT: "val"
  ZIP_BLOCK_SIZE: 8
  
  CROP_SIZE: 448
  CROP_SCALE: [0.4, 2.0]

  CROP_SIZE_STAGE1: 448
  CROP_SCALE_STAGE1: [0.4, 2.0]

  CROP_SIZE_STAGE2: 448
  CROP_SCALE_STAGE2: [1, 2.0]

  
  NORM_MEAN: [0.48145466, 0.4578275, 0.40821073]
  NORM_STD: [0.26862954, 0.26130258, 0.27577711]
  
  IMG_EXTS: [".jpg", ".png"]
  MIN_GT_COUNT: 0
  MAX_ATTEMPTS: 10

# ============================================================
# MODEL ARCHITECTURE
# ============================================================
BACKBONE:
  TYPE: "resnet50"
  PRETRAINED: True
  FREEZE_BN: False

ZIP_HEAD:
  HIDDEN_DIM: 256

CLIP_EBC_HEAD:
  CLIP_MODEL: "RN50"
  PRETRAINED: "openai"
  PROMPT_TYPE: "template"
  WINDOW_SIZE: 16

# --- CONFIGURAZIONE BIN PER SHB (Sparso) ---
# Basata sulla distribuzione reale di SHB (max count 15)
BINS:
  - [0, 0]
  - [1, 1]
  - [2, 2]
  - [3, 3]
  - [4, 9999]  # "There are more than 4 people"

NUM_BINS: 5
# I centri vanno ricalcolati sul train set per il bin >4, ma per ora approssimiamo:
BIN_CENTERS: [0.0, 1.0, 2.0, 3.0, 5.5]

# ============================================================
# TRAINING STAGES
# ============================================================
TRAIN_STAGE1:
  EPOCHS: 400
  BATCH_SIZE: 32 # SHB ha immagini grandi, se la GPU soffre riduci a 16
  NUM_WORKERS: 8
  VAL_INTERVAL: 5
  OPTIMIZER: "adamw"
  LR_BACKBONE: 1.0e-5
  LR_HEAD: 5.0e-4
  WEIGHT_DECAY: 1.0e-4
  POS_WEIGHT: 2.0 # Va bene anche per SHB (molti zeri)

EVAL_STAGE1:
  THRESHOLD: 0.3

TRAIN_STAGE2:
  BATCH_SIZE: 32
  NUM_WORKERS: 8
  TOTAL_EPOCHS: 1500 # SHB è più piccolo/semplice, 1500 sono tante ma sicure
  EVAL_START: 0
  EVAL_FREQ: 5
  OPTIMIZER: "adamw"
  LR: 1.0e-4      
  LR_BACKBONE: 1.0e-5
  LR_HEAD: 1.0e-4
  WEIGHT_DECAY: 1.0e-4
  CLIP_MAX_NORM: 0.1
  AMP: true
  CLIP_GRAD_NORM: 1.0

LOSS_STAGE2:
  TYPE: "dace"
  WEIGHT_COUNT_LOSS: 1.0
  COUNT_LOSS: "dmcount"
  WEIGHT_OT: 0.1
  WEIGHT_TV: 0.01
  LABEL_SMOOTHING: 0.0

TRAIN_STAGE3:
  EPOCHS: 200
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  LR: 1.0e-6         
  WEIGHT_DECAY: 1.0e-4
  LAMBDA_ZIP: 1.0
  LAMBDA_CLIP: 1.0
  LAMBDA_COUNT: 10.0
  EVAL_FREQ: 1
  SAVE_FREQ: 5

EXP:
  OUT_DIR: "./checkpoints"
  SAVE_BEST: true
  LOG_INTERVAL: 50