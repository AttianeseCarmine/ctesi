# configs/config_sha.yaml
# ============================================================
# ZIP-CLIP-EBC: Configurazione STABILE (MAE ~84)
# ============================================================

RUN_NAME: "sha_res50"
SEED: 42
DEVICE: "cuda"

# ============================================================
# DATASET
# ============================================================
DATASET: "sha"
DATA:
  ROOT: "./data/sha/"
  TRAIN_SPLIT: "train"
  VAL_SPLIT: "val"
  # CLIP-EBC usa standard ImageNet mean/std per RN50
  NORM_MEAN: [0.48145466, 0.4578275, 0.40821073]
  NORM_STD:  [0.26862954, 0.26130258, 0.27577711]
  CROP_SIZE: 448
  CROP_SCALE: [0.5, 2.0]
  IMG_EXTS: [".jpg", ".png"]

# Modifica per Stage 1 (ZIP)
BACKBONE:
  TYPE: "resnet50"       # <--- Usa ResNet50
  PRETRAINED: True
  FREEZE_BN: True
# ============================================================
# MODEL: CLIP RN50 (ResNet50)
# ============================================================
CLIP_EBC_HEAD:
  CLIP_MODEL: "RN50"       # ResNet50
  PRETRAINED: "openai"
  PROMPT_TYPE: "word"      # Usa "one", "two", "three"...
  WINDOW_SIZE: 16          # Finestra di attenzione
  REDUCTION: 8           # RN50 riduce di 32x, ma con dilation diventa 16x

# ============================================================
# BINS PER DENSITÀ BASSA (SHA)
# ============================================================
BINS:
  - [0, 0]
  - [1, 1]
  - [2, 2]
  - [3, 3]
  - [4, 9999]

NUM_BINS: 5
# Il valore 4.29992 è calcolato statisticamente dal repo ufficiale per SHA
BIN_CENTERS: [0.0, 1.0, 2.0, 3.0, 4.29992]


# ============================================================
# TRAINING STAGES 1
# ============================================================
TRAIN_STAGE1:
  EPOCHS: 2000
  BATCH_SIZE: 32
  NUM_WORKERS: 8
  VAL_INTERVAL: 5
  OPTIMIZER: "adamw"
  LR_BACKBONE: 1.0e-5
  LR_HEAD: 5.0e-4
  WEIGHT_DECAY: 1.0e-4
  POS_WEIGHT: 10

EVAL_STAGE1:
  THRESHOLD: 0.3
# ============================================================
# TRAINING (Stage 2)
# ============================================================
TRAIN_STAGE2:
  TOTAL_EPOCHS: 2600       
  BATCH_SIZE: 8   
  EVAL_FREQ: 15     
  NUM_WORKERS: 4
  # Strategia Learning Rate Ufficiale
  OPTIMIZER: "adamw"
  LR_BACKBONE: 1.0e-5      
  LR_HEAD: 1.0e-4          
  WEIGHT_DECAY: 1.0e-4
  CLIP_GRAD_NORM: 10.0
  WARMUP_EPOCHS: 50        
  AMP: true

LOSS_STAGE2:
  TYPE: "dace"
  COUNT_LOSS: "dmcount"   
  WEIGHT_OT: 0.1
  WEIGHT_TV: 0.01
  WEIGHT_COUNT_LOSS: 1.0  # Peso per MAE loss ausiliaria
  LABEL_SMOOTHING: 0.0

TRAIN_STAGE3:
  EPOCHS: 600
  BATCH_SIZE: 8          # Basso perché carichiamo 2 modelli in VRAM
  NUM_WORKERS: 4
  
  # Optimizer params (Learning Rate molto basso per non rovinare CLIP)
  #LR: 1.0e-5             
  LR: 1.0e-6       # Sperimentale leggermente più alto
  WEIGHT_DECAY: 1.0e-4
  LAMBDA_ZIP: 0.5    # Dà importanza alla precisione di ZIP
  LAMBDA_CLIP: 1.0   # Mantiene la capacità di conteggio di CLIP
  LAMBDA_CONS: 0.2   # <--- AGGIUNGI QUESTO: evita che ZIP "mangi" persone reali
  STEEPNESS_START: 1.0
  STEEPNESS_END: 20.0
  
  AMP: true
  CLIP_GRAD_NORM: 1.0
  LOG_EVERY: 50
  MASK_THR: 0.5
  MASK_EPS: 0.001
  # PERCORSI DEI PESI PRE-ADDESTRATI (Fondamentale!)
  # Sostituisci con i percorsi reali dei tuoi .pth migliori
  CHECKPOINT_STAGE1: "checkpoints/sha_res50/stage1/best_model.pth" 
  CHECKPOINT_STAGE2: "checkpoints/sha_res50/stage2/best_model.pth"

EVAL_STAGE3:
  # Parametri per la strategia "Hard" (Divide et Impera)
  PATCH_SIZE: 224        # Dimensione del blocco analizzato
  STRIDE: 224            # 224 = Nessuna sovrapposizione (taglio netto)
  THRESHOLD: 0.5         # Se prob. presenza < 0.5, il blocco viene ignorato


EXP:
  OUT_DIR: "./checkpoints"
  SAVE_BEST: true
  LOG_INTERVAL: 50