# configs/config_qnrf_vit.yaml
# ============================================================
# ZIP-CLIP-EBC: Configurazione specifica per UCF-QNRF (High Density)
# ============================================================

RUN_NAME: "qnrf_vit_PROVA"
SEED: 42
DEVICE: "cuda"

# ============================================================
# DATASET (UCF-QNRF)
# ============================================================
DATASET: "qnrf"
DATA:
  ROOT: "./data/qnrf/"
  TRAIN_SPLIT: "train"
  VAL_SPLIT: "val"
  # Normalizzazione CLIP obbligatoria per ViT e Stage 2
  NORM_MEAN: [0.48145466, 0.4578275, 0.40821073]
  NORM_STD:  [0.26862954, 0.26130258, 0.27577711]
  CROP_SIZE: 448
  CROP_SCALE: [0.5, 2.0]
  IMG_EXTS: [".jpg", ".png"]

# ============================================================
# BACKBONE: ViT-B/16 (Allineato tra Stage 1 e 2)
# ============================================================
BACKBONE:
  TYPE: "vit_b_16"      
  PRETRAINED: "openai"
  FREEZE_BN: True

# ============================================================
# MODEL: CLIP_EBC
# ============================================================
CLIP_EBC_MODEL:
  BACKBONE: "vit_b_16"    # "resnet50" o "vit_b_16"
  REDUCTION: 16           # 8 per ResNet, 16 per ViT-B (nativo)
  INPUT_SIZE: 448      # Coerente con l'upsample in backbone.py e clip_ebc_model.py

  NUM_VPT: 32             # Dal paper: 32 token è ottimale
  DEEP_VPT: True          # Prompt su tutti i layer
  VPT_DROP: 0.0
# ============================================================
# BINS UFFICIALI QNRF (Estratti da reduction_16.json)
# ============================================================
BINS:
  - [0, 0]
  - [1, 1]
  - [2, 2]
  - [3, 3]
  - [4, 5]       # Bin raggruppato
  - [6, 7]       # Bin raggruppato
  - [8, "inf"]   # Coda lunga (alta densità)

NUM_BINS: 7

# ANCHOR POINTS (Stimati per Reduction 16)
# L'ultimo valore (36.5) è alto perché in QNRF un blocco 16x16 
# può contenere molte persone (media della coda).
BIN_CENTERS: [0.0, 1.0, 2.0, 3.0, 4.4, 6.4, 36.5]

# ============================================================
# TRAINING STAGES
# ============================================================

# STAGE 1 (ZIP): Impara la maschera binaria
TRAIN_STAGE1:
  EPOCHS: 1000            # QNRF converge prima rispetto a SHB
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  VAL_INTERVAL: 5
  OPTIMIZER: "adamw"
  LR_BACKBONE: 1.0e-5
  LR_HEAD: 5.0e-4        # Alzato per far imparare la "testa" più velocemente
  WEIGHT_DECAY: 1.0e-4
  POS_WEIGHT: 2.5        # <--- IL CAMBIO CHIAVE: da 10 a 2.5 (Prudente ma non cieco)

EVAL_STAGE1:
  THRESHOLD: 0.45

# STAGE 2 (CLIP-EBC): Impara a contare tramite similarità semantica
TRAIN_STAGE2:
  EPOCHS: 1300 # Il paper usa ~500-1000 per dataset piccoli, 200 per start
  BATCH_SIZE: 8 # 8 va bene su GPU medie (es. 24GB), scendi a 4 se OOM
  NUM_WORKERS: 4
  
  # Optimizer
  LR_BACKBONE: 0.0        # 0.0 perché CLIP ViT è congelato! (Solo VPT si allena)
  LR_HEAD: 1.0e-4         # Learning rate per VPT e Decoder
  WEIGHT_DECAY: 1.0e-4
  
  # Scheduler
  WARMUP_EPOCHS: 5

# ============================================================
# LOSS (DACE)
# ============================================================
LOSS_STAGE2:
  WEIGHT_COUNT: 0.01      # Lambda nel paper
  COUNT_LOSS: "dmcount"  # Usa la loss basata su OT
  WEIGHT_OT: 0.1         # Default DMCount param
  WEIGHT_TV: 0.01        # Default DMCount param

# STAGE 3 (JOINT): Fusione Maschera + Densità
TRAIN_STAGE3:
  EPOCHS: 400
  BATCH_SIZE: 4
  NUM_WORKERS: 4
  LR: 1.0e-6
  WEIGHT_DECAY: 1.0e-4
  LAMBDA_ZIP: 0.5
  LAMBDA_CLIP: 1.0
  LAMBDA_CONS: 0.1       # Consistenza spaziale
  AMP: true
  MASK_THR: 0.4          # Threshold per la maschera ZIP
  CHECKPOINT_STAGE1: "checkpoints/qnrf_vit/stage1/best_model.pth"
  CHECKPOINT_STAGE2: "checkpoints/qnrf_vit/stage2/best_model.pth"

EXP:
  OUT_DIR: "./checkpoints"
  SAVE_BEST: true
  LOG_INTERVAL: 50