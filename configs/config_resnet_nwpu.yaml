# ============================================================
# ZIP-CLIP-EBC: Configurazione Completa a 3 Stadi
# Dataset: NWPU - Backbone: resnet (CLIP)
# ============================================================

# Questi valori vengono usati se non specificati nei singoli stage o da terminale
DATASET: "nwpu"
MODEL: "clip_resnet50"   # STAGE2 !!
INPUT_SIZE: 448          # FONDAMENTALE: CLIP richiede 224x224 (o multipli/crop)
REDUCTION: 8             # Fattore di riduzione delle feature map
TRUNCATION: 4            # Max count per bin (EBC logic)
GRANULARITY: "fine"      # Granularità dei bin
PROMPT_TYPE: "word"      # Prompt per CLIP ("word" o "number")
SEED: 42


BACKBONE:
  TYPE: "resnet50"       # STAGE1 !!
  PRETRAINED: True
  FREEZE_BN: True


# ============================================================
# STAGE 1: ZIP (Zero-Inflated Poisson) Pre-training
# Obiettivo: Addestrare la rete a distinguere Background (0) da Folla (>0)
# ============================================================
TRAIN_STAGE1:
  TOTAL_EPOCHS: 2000
  BATCH_SIZE: 16
  NUM_WORKERS: 8
  
  # Learning Rates
  LR: 1.0e-4
  LR_BACKBONE: 1.0e-5    # Basso per non rovinare i pesi iniziali
  LR_HEAD: 1.0e-4        # Normale per la testa di classificazione binaria (pi_head)
  WEIGHT_DECAY: 1.0e-4
  
  SLIDING_WINDOW: True
  WINDOW_SIZE: 448
  STRIDE: 448      

  POS_WEIGHT: 15         # Peso maggiore per la classe "Folla" (che è minoritaria nei patch)

# ============================================================
# STAGE 2: CLIP-EBC Pure Training
# Obiettivo: Addestrare il contatore EBC sulle patch NON vuote usando CLIP
# Nota: Qui usiamo la logica "Pura" con pesi OpenAI
# ============================================================
TRAIN_STAGE2:
  TOTAL_EPOCHS: 2500      # Aumenta se il loss scende lentamente
  BATCH_SIZE: 16         # CLIP consuma VRAM, riduci a 8 se vai OOM (Out Of Memory)
  NUM_WORKERS: 8
  EVAL_FREQ: 5           # Valuta ogni 5 epoche per risparmiare tempo
  
  # Optimizer & Scheduler
  LR: 1.0e-5             # LR Base
  LR_BACKBONE: 1e-8       # 0.0 = FREEZE CLIP (Usiamo i pesi puri OpenAI senza modificarli)
                         # Metti 1.0e-6 se vuoi fare fine-tuning leggerissimo della backbone
  LR_HEAD: 1.0e-6        # Addestra il decoder EBC e i bin
  WEIGHT_DECAY: 1.0e-4
  WARMUP_EPOCHS: 10      # Warmup più lungo per stabilità
  

  SLIDING_WINDOW: True
  WINDOW_SIZE: 448
  STRIDE: 448       # O 224 se vuoi sovrapposizione (più lento ma più preciso)

  # Loss Function (DACE / EBC)
  WEIGHT_COUNT_LOSS: 1.0
  COUNT_LOSS: "dmcount"  # Distribution Matching Loss (consigliata per EBC)
  WEIGHT_OT: 0.1 
  WEIGHT_TV: 0.01   # Total Variation Loss (riduce il rumore nella density map)

# ============================================================
# STAGE 3: JOINT Fine-tuning
# Obiettivo: Unire ZIP e CLIP-EBC e rifinire il modello completo
# ============================================================
TRAIN_STAGE3:
  TOTAL_EPOCHS: 1500
  BATCH_SIZE: 4          # Molto basso: ora abbiamo in memoria Backbone + ZIP Head + EBC Head
  NUM_WORKERS: 4
  
  # Learning Rate "Chirurgico"
  LR: 1.0e-6             # LR infinitesimale per non distruggere ciò che Stage 1 e 2 hanno imparato
  LR_BACKBONE: 1.0e-7    # Praticamente fermo
  
  EVAL_FREQ: 1
  SAVE_FREQ: 5