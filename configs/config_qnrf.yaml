# configs/config_qnrf.yaml
# ============================================================
# Configurazione SOTA per UCF-QNRF (ViT + VGG Hybrid) - FIXED
# ============================================================

RUN_NAME: "qnrf"
SEED: 42
DEVICE: "cuda"

# ============================================================
# DATASET
# ============================================================
DATASET: "ucf_qnrf"
DATA:
  ROOT: "./data/ucf_qnrf/"
  TRAIN_SPLIT: "train"
  VAL_SPLIT: "val" 
  
  NORM_MEAN: [0.485, 0.456, 0.406]
  NORM_STD: [0.229, 0.224, 0.225]
  
  CROP_SIZE: 224  
  CROP_SCALE: [0.5, 2.0]
  IMG_EXTS: [".jpg", ".jpeg", ".png"]

# ============================================================
# STAGE 1: ZIP (Filtro) - VGG16
# ============================================================
BACKBONE:
  TYPE: "vgg16_bn"       
  PRETRAINED: True
  FREEZE_BN: True

ZIP_HEAD:
  HIDDEN_DIM: 256

# ============================================================
# STAGE 2: CLIP (Contatore) - ViT-B/16
# ============================================================
CLIP_EBC_HEAD:
  CLIP_MODEL: "ViT-B/16"
  PRETRAINED: "openai"
  PROMPT_TYPE: "word"
  REDUCTION: 16            

# ============================================================
# BINS (Dynamic per QNRF)
# ============================================================
BINS:
  - [0, 0]
  - [1, 1]
  - [2, 2]
  - [3, 3]
  - [4, 5]
  - [6, 7]
  - [8, 9999]

NUM_BINS: 7
BIN_CENTERS: [0.0, 1.0, 2.0, 3.0, 4.29, 6.31, 9.23]

# ============================================================
# HYPERPARAMETERS
# ============================================================
TRAIN_STAGE1:
  EPOCHS: 600
  BATCH_SIZE: 16
  NUM_WORKERS: 4         # <--- AGGIUNTO (Era mancante)
  
  # Learning Rates
  LR: 1.0e-4             # LR base
  LR_BACKBONE: 1.0e-5    # <--- AGGIUNTO per compatibilità
  LR_HEAD: 1.0e-4        # <--- AGGIUNTO (Risolve KeyError: 'LR_HEAD')
  
  WEIGHT_DECAY: 1.0e-4
  POS_WEIGHT: 1.0
  VAL_INTERVAL: 1

TRAIN_STAGE2:
  EPOCHS: 1500
  BATCH_SIZE: 32         
  NUM_WORKERS: 4         # <--- AGGIUNTO (Risolve KeyError: 'NUM_WORKERS')
  
  LR_BACKBONE: 1.0e-6    
  LR_HEAD: 1.0e-4
  WEIGHT_DECAY: 0.05
  WARMUP_EPOCHS: 5
  CLIP_GRAD_NORM: 10.0
  AMP: True              

LOSS_STAGE2:
  TYPE: "dace"
  WEIGHT_COUNT_LOSS: 1.0
  COUNT_LOSS: "dmcount"
  WEIGHT_OT: 0.1
  WEIGHT_TV: 0.01

TRAIN_STAGE3:
  EPOCHS: 400
  BATCH_SIZE: 16
  NUM_WORKERS: 4         # <--- AGGIUNTO
  
  LR: 1.0e-5             
  LR_HEAD: 1.0e-5
  LR_BACKBONE: 1.0e-6
  WEIGHT_DECAY: 1.0e-4
  LAMBDA_ZIP: 0.5
  LAMBDA_CLIP: 1.0
  LAMBDA_COUNT: 1.0
  
  # Questi file esisteranno SOLO DOPO aver finito Stage 1 e 2
  CHECKPOINT_STAGE1: "checkpoints/qnrf/stage1/best_model.pth"
  CHECKPOINT_STAGE2: "checkpoints/qnrf/stage2/best_model.pth"